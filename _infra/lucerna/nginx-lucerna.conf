server {
    listen 80;
    server_name lucerna.folkup.app;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # --- Public URLs (no auth required) ---

    location /legal/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location /ru/legal/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location /pt/legal/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    location /about/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location /ru/about/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location /pt/about/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    location /methodology/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location /ru/methodology/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location /pt/methodology/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    location = /robots.txt {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    # Studies section
    location = /studies/ {
        auth_request off;
        alias /usr/share/nginx/html/studies/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /ru/studies/ {
        auth_request off;
        alias /usr/share/nginx/html/ru/studies/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /pt/studies/ {
        auth_request off;
        alias /usr/share/nginx/html/pt/studies/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location ~ ^/(ru/|pt/)?studies/mushroom-brain- {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location ~ ^/(ru/|pt/)?studies/eu-ai-act- {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location ~ ^/(ru/|pt/)?studies/rastafari- {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location ~ ^/(ru/|pt/)?studies/(karma-proverb|immortal-proverb|drug-content-legislation|hymn-democratic-youth|ai-labor-market) {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location ~ ^/(ru/|pt/)?studies/scatology- {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    # Investigations section
    location ~ ^/(ru/|pt/)?investigations/osint-career-reconstruction-case {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location ~ ^/(ru/|pt/)?investigations/flightpath3d-labor-case-study {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /investigations/ {
        auth_request off;
        alias /usr/share/nginx/html/investigations/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /ru/investigations/ {
        auth_request off;
        alias /usr/share/nginx/html/ru/investigations/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /pt/investigations/ {
        auth_request off;
        alias /usr/share/nginx/html/pt/investigations/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    # Archived investigation — 410 Gone (LCRN-086)
    location ~ ^/(ru/|pt/)?investigations/kmatveev-habr-osint {
        return 410;
    }

    location ~ ^/(ru/|pt/)?verifications/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    location = /services/ {
        auth_request off;
        alias /usr/share/nginx/html/services/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /ru/services/ {
        auth_request off;
        alias /usr/share/nginx/html/ru/services/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /pt/services/ {
        auth_request off;
        alias /usr/share/nginx/html/pt/services/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    location = /research/ {
        auth_request off;
        alias /usr/share/nginx/html/research/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /ru/research/ {
        auth_request off;
        alias /usr/share/nginx/html/ru/research/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /pt/research/ {
        auth_request off;
        alias /usr/share/nginx/html/pt/research/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    location ~ ^/(ru/|pt/)?toolkit/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    location ~ ^/(ru/|pt/)?newsletter(/|$) {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    # --- 301 Redirects: investigations/ -> studies/ (SEO) ---
    location ~ ^(?<lang>/(?:ru|pt))?/investigations/(mushroom-brain-.*)$ {
        return 301 $lang/studies/$2;
    }
    location ~ ^(?<lang>/(?:ru|pt))?/investigations/(eu-ai-act-.*)$ {
        return 301 $lang/studies/$2;
    }
    location ~ ^(?<lang>/(?:ru|pt))?/investigations/(rastafari-.*)$ {
        return 301 $lang/studies/$2;
    }
    location ~ ^(?<lang>/(?:ru|pt))?/investigations/(karma-proverb-origin.*)$ {
        return 301 $lang/studies/$2;
    }
    location ~ ^(?<lang>/(?:ru|pt))?/investigations/(immortal-proverb-origin.*)$ {
        return 301 $lang/studies/$2;
    }
    location ~ ^(?<lang>/(?:ru|pt))?/investigations/(drug-content-legislation.*)$ {
        return 301 $lang/studies/$2;
    }
    location ~ ^(?<lang>/(?:ru|pt))?/investigations/(hymn-democratic-youth.*)$ {
        return 301 $lang/studies/$2;
    }
    location ~ ^(?<lang>/(?:ru|pt))?/investigations/(ai-labor-market.*)$ {
        return 301 $lang/studies/$2;
    }

    location ~ ^/(ru/|pt/)?tags/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location ~ ^/(ru/|pt/)?categories/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    # Homepage (EN/RU/PT)
    location = / {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /index.html {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /ru/ {
        auth_request off;
        alias /usr/share/nginx/html/ru/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /pt/ {
        auth_request off;
        alias /usr/share/nginx/html/pt/;
        try_files index.html =404;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    # Reviews: StatiCrypt per-client passwords (no nginx auth)
    location /reviews/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /api/ {
        auth_request off;
        default_type application/json;
        return 502 '{"error":"service_unavailable"}';
    }

    # --- Security Headers (server-level) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; worker-src 'self' blob:; base-uri 'self'; form-action 'self';" always;

    # --- FP3D Dossier (^~ overrides caching regex — LCRN-074) ---
    location ^~ /fp3d/ {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers-auth.conf;
    }
    location ^~ /fp3d-public/ {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers-auth.conf;
    }

    # FP3D case files — htpasswd auth (oauth2-proxy removed, Keycloak decommissioned 2026-04-22)
    location = /fp3d.html {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/fp3d-paths.htpasswd;
        include /etc/nginx/snippets/security-headers-auth.conf;
    }
    location = /fp3d-dashboard.html {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/fp3d-paths.htpasswd;
        include /etc/nginx/snippets/security-headers-auth.conf;
    }

    # OSINT dossier (LCRN-074: PII protection)
    location = /x713.html {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;
        include /etc/nginx/snippets/security-headers-auth.conf;
    }

    # --- Caching ---
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        auth_request off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location ~* \.(css|js|woff|woff2|ttf|eot)$ {
        auth_request off;
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    # --- Error pages ---
    error_page 403 /403.html;
    error_page 404 /404.html;

    location = /403.html {
        auth_request off;
        internal;
        include /etc/nginx/snippets/security-headers-auth.conf;
    }
    location = /404.html {
        auth_request off;
        internal;
        include /etc/nginx/snippets/security-headers-public.conf;
    }
    location = /auth-unavailable.html {
        auth_request off;
        internal;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    location ~* /sitemap\.xml$ {
        auth_request off;
        include /etc/nginx/snippets/security-headers-public.conf;
    }

    # --- Catch-all: htpasswd for unlisted paths ---
    location / {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers-auth.conf;
    }
}
