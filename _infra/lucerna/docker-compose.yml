version: "3.8"

services:
  lucerna:
    image: nginx:alpine
    container_name: lucerna
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=lucerna.folkup.app
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=lucerna.folkup.app
      - LETSENCRYPT_EMAIL=admin@folkup.app
    volumes:
      - /home/deploy/lucerna/public:/usr/share/nginx/html:ro
      - /home/deploy/lucerna/nginx-lucerna.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/deploy/lucerna/htpasswd:/etc/nginx/htpasswd:ro
      - /home/deploy/lucerna/snippets:/etc/nginx/snippets:ro
      - /opt/folkup/secrets/bastion/fp3d-paths.htpasswd:/etc/nginx/fp3d-paths.htpasswd:ro
    networks:
      - web

networks:
  web:
    external: true
