<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AGILE SAPIENS — OG card 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #2a2a2a; }
  body { display: flex; align-items: center; justify-content: center; }

  .og {
    width: 1200px;
    height: 630px;
    background-color: #f0e4cb;
    background-image:
      radial-gradient(circle at 14% 32%, rgba(110, 70, 30, 0.05) 0%, transparent 10px),
      radial-gradient(circle at 82% 22%, rgba(110, 70, 30, 0.04) 0%, transparent 12px),
      radial-gradient(circle at 28% 76%, rgba(110, 70, 30, 0.05) 0%, transparent 9px),
      radial-gradient(circle at 88% 78%, rgba(110, 70, 30, 0.05) 0%, transparent 11px),
      linear-gradient(178deg, #f3e7cf 0%, #ebdec1 100%);
    position: relative;
    font-family: 'EB Garamond', 'Times New Roman', serif;
    color: #5a1a1a;
    overflow: hidden;
  }

  .frame {
    position: absolute;
    top: 40px;
    left: 40px;
    right: 40px;
    bottom: 40px;
    border: 3px solid #5a1a1a;
    box-sizing: border-box;
  }
  .frame::before {
    content: '';
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    bottom: 14px;
    border: 1px solid #5a1a1a;
  }
  .corner {
    position: absolute;
    width: 26px;
    height: 26px;
    line-height: 0;
  }
  .corner.tl { top: -13px; left: -13px; }
  .corner.tr { top: -13px; right: -13px; }
  .corner.bl { bottom: -13px; left: -13px; }
  .corner.br { bottom: -13px; right: -13px; }

  .title {
    position: absolute;
    top: 165px;
    left: 0;
    width: 100%;
    text-align: center;
    margin: 0;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 96px;
    letter-spacing: 0.045em;
    color: #4a1414;
    line-height: 1;
  }

  .rule {
    position: absolute;
    top: 302px;
    left: 50%;
    transform: translateX(-50%);
    width: 380px;
    height: 28px;
  }

  .subtitle {
    position: absolute;
    top: 360px;
    left: 0;
    width: 100%;
    text-align: center;
    margin: 0;
    padding: 0 90px;
    box-sizing: border-box;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 32px;
    line-height: 1.35;
    color: #4a1414;
  }

  .author {
    position: absolute;
    bottom: 70px;
    left: 0;
    width: 100%;
    text-align: center;
    margin: 0;
    font-family: 'EB Garamond', serif;
    font-variant: small-caps;
    font-size: 26px;
    letter-spacing: 0.1em;
    color: #4a1414;
  }
</style>
</head>
<body>
<div class="og">
  <div class="frame">
    <span class="corner tl">
      <svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
        <polygon points="13,2 24,13 13,24 2,13" fill="#5a1a1a"/>
        <polygon points="13,6 20,13 13,20 6,13" fill="#f0e4cb"/>
        <polygon points="13,10 16,13 13,16 10,13" fill="#5a1a1a"/>
      </svg>
    </span>
    <span class="corner tr">
      <svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
        <polygon points="13,2 24,13 13,24 2,13" fill="#5a1a1a"/>
        <polygon points="13,6 20,13 13,20 6,13" fill="#f0e4cb"/>
        <polygon points="13,10 16,13 13,16 10,13" fill="#5a1a1a"/>
      </svg>
    </span>
    <span class="corner bl">
      <svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
        <polygon points="13,2 24,13 13,24 2,13" fill="#5a1a1a"/>
        <polygon points="13,6 20,13 13,20 6,13" fill="#f0e4cb"/>
        <polygon points="13,10 16,13 13,16 10,13" fill="#5a1a1a"/>
      </svg>
    </span>
    <span class="corner br">
      <svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
        <polygon points="13,2 24,13 13,24 2,13" fill="#5a1a1a"/>
        <polygon points="13,6 20,13 13,20 6,13" fill="#f0e4cb"/>
        <polygon points="13,10 16,13 13,16 10,13" fill="#5a1a1a"/>
      </svg>
    </span>
  </div>

  <h1 class="title">AGILE SAPIENS.</h1>

  <svg class="rule" viewBox="0 0 380 28" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="20" y1="14" x2="160" y2="14" stroke="#5a1a1a" stroke-width="1.5"/>
    <polygon points="186,6 198,14 186,22 174,14" fill="#5a1a1a"/>
    <line x1="220" y1="14" x2="360" y2="14" stroke="#5a1a1a" stroke-width="1.5"/>
    <circle cx="20" cy="14" r="2" fill="#5a1a1a"/>
    <circle cx="360" cy="14" r="2" fill="#5a1a1a"/>
  </svg>

  <p class="subtitle">Как классическая литература предсказывала,<br>опережала и предупреждала современный менеджмент</p>

  <p class="author">Команданте FolkUp</p>
</div>
</body>
</html>
