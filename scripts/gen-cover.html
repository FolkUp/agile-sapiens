<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AGILE SAPIENS — Cover (final)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #2a2a2a; }
  body { display: flex; align-items: center; justify-content: center; }

  .cover {
    width: 1600px;
    height: 2400px;
    background-color: #f0e4cb;
    background-image:
      radial-gradient(circle at 12% 22%, rgba(110, 70, 30, 0.05) 0%, transparent 14px),
      radial-gradient(circle at 84% 13%, rgba(110, 70, 30, 0.04) 0%, transparent 18px),
      radial-gradient(circle at 18% 58%, rgba(110, 70, 30, 0.05) 0%, transparent 16px),
      radial-gradient(circle at 89% 71%, rgba(110, 70, 30, 0.06) 0%, transparent 13px),
      radial-gradient(circle at 51% 89%, rgba(110, 70, 30, 0.04) 0%, transparent 18px),
      radial-gradient(circle at 36% 38%, rgba(110, 70, 30, 0.03) 0%, transparent 22px),
      radial-gradient(circle at 67% 47%, rgba(110, 70, 30, 0.04) 0%, transparent 15px),
      linear-gradient(178deg, #f3e7cf 0%, #ebdec1 100%);
    position: relative;
    font-family: 'EB Garamond', 'Times New Roman', serif;
    color: #5a1a1a;
    overflow: hidden;
  }

  /* Outer double-rule frame */
  .frame {
    position: absolute;
    top: 100px;
    left: 100px;
    width: 1400px;
    height: 2200px;
    border: 4px solid #5a1a1a;
    box-sizing: border-box;
  }
  .frame::before {
    content: '';
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    bottom: 20px;
    border: 1.5px solid #5a1a1a;
  }
  /* SVG corner ornaments — nested diamond fleurons */
  .corner {
    position: absolute;
    width: 44px;
    height: 44px;
    line-height: 0;
  }
  .corner.tl { top: -22px; left: -22px; }
  .corner.tr { top: -22px; right: -22px; }
  .corner.bl { bottom: -22px; left: -22px; }
  .corner.br { bottom: -22px; right: -22px; }

  /* Content positioning */
  .title {
    position: absolute;
    top: 640px;
    left: 0;
    width: 100%;
    margin: 0;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 156px;
    letter-spacing: 0.045em;
    line-height: 1;
    color: #4a1414;
  }

  /* Printer's rule with center ornament between title and subtitle */
  .rule {
    position: absolute;
    top: 880px;
    left: 50%;
    transform: translateX(-50%);
    width: 520px;
    height: 36px;
  }

  .subtitle {
    position: absolute;
    top: 1010px;
    left: 0;
    width: 100%;
    margin: 0;
    text-align: center;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 52px;
    line-height: 1.42;
    color: #4a1414;
    padding: 0 130px;
    box-sizing: border-box;
  }

  .author {
    position: absolute;
    top: 1620px;
    left: 0;
    width: 100%;
    margin: 0;
    text-align: center;
    font-family: 'EB Garamond', serif;
    font-weight: 400;
    font-variant: small-caps;
    font-size: 50px;
    letter-spacing: 0.1em;
    color: #4a1414;
  }

  /* Bottom rule above imprint */
  .rule-bottom {
    position: absolute;
    bottom: 245px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 22px;
  }

  .imprint {
    position: absolute;
    bottom: 170px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: 'EB Garamond', serif;
    font-weight: 500;
    font-size: 26px;
    letter-spacing: 0.45em;
    color: #4a1414;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="frame">
    <!-- Four corner fleurons: nested diamond with hollow ring -->
    <span class="corner tl">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <polygon points="22,2 42,22 22,42 2,22" fill="#5a1a1a"/>
        <polygon points="22,8 36,22 22,36 8,22" fill="#f0e4cb"/>
        <polygon points="22,14 30,22 22,30 14,22" fill="#5a1a1a"/>
      </svg>
    </span>
    <span class="corner tr">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <polygon points="22,2 42,22 22,42 2,22" fill="#5a1a1a"/>
        <polygon points="22,8 36,22 22,36 8,22" fill="#f0e4cb"/>
        <polygon points="22,14 30,22 22,30 14,22" fill="#5a1a1a"/>
      </svg>
    </span>
    <span class="corner bl">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <polygon points="22,2 42,22 22,42 2,22" fill="#5a1a1a"/>
        <polygon points="22,8 36,22 22,36 8,22" fill="#f0e4cb"/>
        <polygon points="22,14 30,22 22,30 14,22" fill="#5a1a1a"/>
      </svg>
    </span>
    <span class="corner br">
      <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <polygon points="22,2 42,22 22,42 2,22" fill="#5a1a1a"/>
        <polygon points="22,8 36,22 22,36 8,22" fill="#f0e4cb"/>
        <polygon points="22,14 30,22 22,30 14,22" fill="#5a1a1a"/>
      </svg>
    </span>
  </div>

  <h1 class="title">AGILE SAPIENS.</h1>

  <!-- Decorative rule with center diamond ornament between title and subtitle -->
  <svg class="rule" viewBox="0 0 520 36" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="20" y1="18" x2="230" y2="18" stroke="#5a1a1a" stroke-width="1.5"/>
    <polygon points="260,8 274,18 260,28 246,18" fill="#5a1a1a"/>
    <line x1="290" y1="18" x2="500" y2="18" stroke="#5a1a1a" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="2.5" fill="#5a1a1a"/>
    <circle cx="500" cy="18" r="2.5" fill="#5a1a1a"/>
  </svg>

  <!-- Subtitle: 3 lines balanced per F7 of the hostile review -->
  <p class="subtitle">Как классическая литература<br>предсказывала, опережала и предупреждала<br>современный менеджмент</p>

  <p class="author">Команданте FolkUp</p>

  <!-- Smaller bottom rule above imprint -->
  <svg class="rule-bottom" viewBox="0 0 320 22" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="20" y1="11" x2="140" y2="11" stroke="#5a1a1a" stroke-width="1"/>
    <circle cx="160" cy="11" r="3" fill="#5a1a1a"/>
    <line x1="180" y1="11" x2="300" y2="11" stroke="#5a1a1a" stroke-width="1"/>
  </svg>

  <div class="imprint">FOLKUP ECOSYSTEM &middot; MMXXVI</div>
</div>
</body>
</html>
