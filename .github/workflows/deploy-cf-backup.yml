# CF Pages backup deploy — independent workflow (per Враг C2: separate file,
# не edit build-deploy.yml). Independent green/red signals в GitHub UI.
#
# Trade-off acknowledged: rebuilds Hugo от scratch on every push (no artifact share
# с build-deploy.yml). +2-3 min per CI run, но critical для failure isolation —
# when VPS down, build-deploy.yml deploy-vps job fails → весь workflow RED;
# отдельный deploy-cf-backup.yml independent.
#
# Quality gates skipped в backup workflow (QG1-7 в build-deploy.yml — they
# block VPS deploy; CF Pages backup intentionally less gated to ensure
# always-available emergency replica). Critical content validation остаётся
# responsibility of main build-deploy.yml workflow.
#
# Pilot scope: CF-BACKUP plan zany-snuggling-garden.md Phase 1
# Owner: Кочегар (DevOps) | Security review: Купер | Plan author: Алиса

name: Deploy to CF Pages (backup)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-backup-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONS_STEP_DEBUG: "false"
  HUGO_VERSION: "0.155.2"   # Match build-deploy.yml line 29 (single source of truth)

jobs:
  build-and-deploy-cf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup Node.js (npm scripts for validation tooling)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.20.2'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Setup Hugo (extended ${{ env.HUGO_VERSION }})
        run: |
          wget -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
          hugo version

      - name: Quality Gate 1 — Hugo Build (kept; identical к build-deploy.yml QG1)
        run: |
          echo "=== CF Backup Quality Gate 1: Hugo Build ==="
          hugo --gc --minify --quiet
          echo "✅ Hugo build PASSED"

      - name: Build Production Site (HUGO_ENVIRONMENT=production)
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify

      - name: Migration to books.folkup.life — remove Hugo HTML (redirect precedence)
        run: |
          # Cont +40 Андрей mandate: «все книги публикуем только на новом
          # портале» + «на старый домен возвращать не будем». sapiens.folkup.life
          # dead → 301 redirect ко books.folkup.life/kn1/.
          # CF Pages: static HTML takes precedence over _redirects — поэтому
          # delete all Hugo-built HTML. Оставляем только maintenance.html
          # как fallback если redirect broken.
          find public -name "*.html" -delete
          cp static/maintenance.html public/maintenance.html

      - name: Generate _redirects + _headers for CF Pages
        run: |
          cat > public/_headers <<'EOF'
          /*
            Strict-Transport-Security: max-age=31536000; includeSubDomains
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            X-Robots-Tag: noindex

          /assets/*
            Cache-Control: public, max-age=31536000, immutable
          EOF

          # 301 permanent redirect всех URL ко новому порталу.
          # Deep URLs (chapters/*, downloads/*.epub) → /kn1/* соответствие
          # (portal имеет такую же routing schema для кн.1).
          # Fallback: root → /kn1/ (main book page).
          # maintenance.html доступен через /maintenance.html если portal down.
          cat > public/_redirects <<'EOF'
          # 301 permanent redirect sapiens.folkup.life → books.folkup.life/kn1/
          # per Андрей cont +40 mandate 2026-07-03 «все книги только на новом портале».

          # SEO discovery files — preserve semantic file type (не HTML page)
          # Portal имеет собственный robots/llms/sitemap на root
          /robots.txt   https://books.folkup.life/robots.txt   301
          /llms.txt     https://books.folkup.life/llms.txt     301
          /sitemap.xml  https://books.folkup.life/sitemap.xml  301

          # Downloads preserve path — новые downloads тоже на portal
          /downloads/*  https://books.folkup.life/kn1/downloads/:splat  301

          # Chapter URLs preserve slug structure
          /chapters/*  https://books.folkup.life/kn1/chapters/:splat  301

          # Apparatus (примечания, cross-refs, etc)
          /apparatus/*  https://books.folkup.life/kn1/apparatus/:splat  301

          # Afterword
          /afterword/*  https://books.folkup.life/kn1/afterword/:splat  301

          # About / colophon
          /about/*  https://books.folkup.life/kn1/about/:splat  301

          # Root + everything else → book main page
          /*  https://books.folkup.life/kn1/  301
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=sapiens-backup --branch=main --commit-message="agile-sapiens auto-deploy"

      # precommit:allow-secrets — step below intentionally contains secret-format
      # regex patterns for §4 self-verify. These are detection patterns, not values.
      - name: Post-deploy secret scan (agent-secret-hygiene §4)
        if: always()
        run: |
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${GITHUB_STEP_SUMMARY}" ]; then
            PATTERNS='(ghp_|github_pat_|xoxb-|sk_live_|r8_|AKIA[0-9A-Z]{16}|AGE-SECRET-KEY-1|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|[0-9]{8,10}:[A-Za-z0-9_-]{35})'
            if grep -qE "$PATTERNS" "${GITHUB_STEP_SUMMARY}" 2>/dev/null; then
              echo "::error::Potential secret detected в step summary — investigate"
              exit 1
            fi
          fi
          echo "::notice::Step-summary secret scan complete (full run-log scan deferred to Phase 7 — ACTIONS_STEP_DEBUG=false is primary G1 mitigation)"
