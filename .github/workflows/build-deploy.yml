# AGIL-007 (post-SAPIENS-SUNSET-1 2026-08-16): Content Validation Pipeline — Quality Gates Only.
# Deploy stages archived per Andrey VIZA-KASKAD S285 §3 mandate (2026-08-16) + Кочегар Path A verdict cont+4 S1DEBRDG.
# Reason: sapiens.folkup.life DECOMMISSIONED 2026-07-03 → 301 → books.folkup.life/kn1 (canonical portal now hosts all content).
# CX33 folkup-prod (46.225.107.2) DECOMMISSIONED 2026-06-07 per INC-006 E1 abandon-clean choice.
# Workflow retained для Iskra Vier-Augen editorial PRs: QG1-7 content validation MUST preserve (Voice Gate / Frontmatter / Level 1).
# Removed jobs: build (redundant — QG1 validates), deploy-vps (dead VPS), smoke-test (no target).
# Companion removal: deploy-cf-backup.yml deleted (sapiens-backup.pages.dev serves 301 rules independent of continuous re-deploy).
name: Content Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "agile-sapiens-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Quality Gates — Banking-Level Standards
  quality-gates:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.155.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Quality Gate 1 — Hugo Build Validation
        run: |
          echo "=== QUALITY GATE 1: Hugo Build ==="
          hugo --gc --minify --quiet
          if [ $? -ne 0 ]; then
            echo "❌ Hugo build FAILED — Zero tolerance policy"
            exit 1
          fi
          echo "✅ Hugo build PASSED"

      - name: Quality Gate 2 — Level 1 Compliance
        run: |
          echo "=== QUALITY GATE 2: Level 1 Compliance ==="
          node scripts/validate-content.js --check=level1
          echo "✅ Level 1 compliance PASSED"

      - name: Quality Gate 3 — Voice Gate (AI Pattern Detection)
        run: |
          echo "=== QUALITY GATE 3: Voice Gate ==="
          node scripts/validate-content.js --check=voice-gate
          echo "✅ Voice Gate PASSED"

      - name: Quality Gate 4 — Frontmatter Schema Validation
        run: |
          echo "=== QUALITY GATE 4: Schema Validation ==="
          node scripts/validate-content.js --check=frontmatter
          echo "✅ Frontmatter validation PASSED"

      - name: Quality Gate 5 — Source Verification
        run: |
          echo "=== QUALITY GATE 5: Source Verification ==="
          node scripts/validate-content.js --check=sources
          echo "✅ Source verification PASSED"

      - name: Quality Gate 6 — Brand Consistency
        run: |
          echo "=== QUALITY GATE 6: Brand Consistency ==="
          node scripts/validate-content.js --check=brand
          echo "✅ Brand consistency PASSED"

      - name: Quality Gate 7a — Internal Link Resolution (cont +13)
        run: |
          echo "=== QUALITY GATE 7a: Internal Link Resolution ==="
          node scripts/internal-link-resolver.cjs
          echo "✅ Internal link resolution PASSED"

      - name: Quality Gate 7 — Playwright E2E Tests
        run: |
          echo "=== QUALITY GATE 7: Playwright E2E ==="
          npx playwright install chromium --with-deps
          # Rebuild with local baseURL so CSS/JS links resolve to local server.
          # QG1 build uses baseURL from hugo.toml (https://sapiens.folkup.life),
          # which makes head-end.html Permalink tags point to production — behind
          # Basic Auth in CI → CSS fails to load → flex overflow test D.2/D.4/D.5 fail.
          hugo --gc --minify --quiet --baseURL http://127.0.0.1:1313/
          python3 -m http.server 1313 --directory ./public &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:1313/ > /dev/null 2>&1 && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:1313 npx playwright test --reporter=line
          EXIT_CODE=$?
          kill $SERVER_PID 2>/dev/null || true
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Playwright E2E FAILED"
            exit $EXIT_CODE
          fi
          echo "✅ Playwright E2E PASSED"

      - name: Upload Quality Gate Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-results
          path: |
            quality-gate-report.json
            build-log.txt
            tests/screenshots/
            playwright-report/